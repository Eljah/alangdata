name: Tatar recognition artifact

on:
  push:
    paths:
      - 'tat/**'
      - '.github/workflows/tatar-artifact.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Tatar test data archive
        run: |
          tar -czf tatar-test-data.tar.gz tat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tatar-recognition-test-data
          path: tatar-test-data.tar.gz
          retention-days: 7

      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'tatar-recognition-test-data';
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );
            const related = artifacts
              .filter((artifact) => artifact.name === artifactName)
              .sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
              );
            if (related.length <= 1) {
              core.info(`Only ${related.length} artifact(s) found; nothing to delete.`);
              return;
            }
            const [, ...older] = related;
            for (const artifact of older) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted artifact ${artifact.id} created on ${artifact.created_at}`);
            }

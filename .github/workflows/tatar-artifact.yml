name: Build Tatar traineddata

on:
  push:
    paths:
      - 'tat/**'
      - '.github/workflows/tatar-artifact.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tesseract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev

      - name: Build tat.traineddata
        run: |
          combine_lang_model \
            --input_unicharset tat/tat.unicharset \
            --script_dir . \
            --words tat/tat.wordlist \
            --numbers tat/tat.numbers \
            --puncs tat/tat.punc \
            --output_dir build \
            --lang tat \
            --version_str "${{ github.sha }}"
          ls -l build/tat

      - name: Upload traineddata artifact
        uses: actions/upload-artifact@v4
        with:
          name: tat-traineddata
          path: build/tat/tat.traineddata
          retention-days: 7

      - name: Delete old traineddata artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'tat-traineddata';
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );
            const related = artifacts
              .filter((artifact) => artifact.name === artifactName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (related.length <= 1) {
              core.info(`Only ${related.length} artifact(s) found; nothing to delete.`);
              return;
            }
            const [, ...older] = related;
            for (const artifact of older) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted artifact ${artifact.id} created on ${artifact.created_at}`);
            }
